# The accessibility gate — Signal's rule ten, in CI.
#
# docs/design-system/README.md: "Accessibility is build-breaking, not polish."
# Until D20 that sentence was aspirational, because nothing in `.github/`
# ran a lint or a test at all: the three deploy workflows type-check and build
# on a push to `main`, behind path filters, and by then review is over.
#
# This runs on every pull request, unfiltered. The gate is four checks:
#
#   lint:tokens   rule zero  — no raw colour or radius in a component
#   lint:a11y     rule ten   — focus ring, 32px target, motion-reduce answer
#   tokens:check  both       — the two generated clients match tokens.json
#   vitest        rule ten   — contrast at 4.5:1 / 3:1 in both modes, plus the
#                              aria semantics and the two reduced-motion states
#
# It runs the whole of `apps/web`'s lint and test rather than only the
# accessibility files. The gate lives inside those two commands, and a green
# gate inside a red suite is not a signal anybody can act on.
#
# `bun run apispec` is not optional: `packages/api-client/src` is gitignored and
# generated, and the components under test import from it.
name: Accessibility gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BUN_VERSION: "1.3.11"
  JAVA_VERSION: "17"

jobs:
  gate:
    name: Rule ten
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Java (for OpenAPI Generator)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Generate API client
        run: bun run apispec

      # Reported separately from the rest of lint so a contrast-adjacent
      # failure names itself in the job summary instead of hiding inside
      # "eslint exited 1".
      - name: Contrast, semantics and reduced motion
        run: bun run --cwd apps/web test -- __tests__/accessibility

      - name: Lint (rule zero, rule ten, token drift)
        run: bun run --cwd apps/web lint

      - name: Web test suite
        run: bun run --cwd apps/web test

      - name: Mobile token rules
        run: bun run --cwd apps/mobile lint:tokens
