name: Mobile PR gate

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/api-client/**"
      - "packages/apispec/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-mobile.yml"
      - ".github/workflows/mobile-pr.yml"

permissions:
  contents: read

concurrency:
  group: mobile-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.11"
  JAVA_VERSION: "17"

jobs:
  quality:
    name: Mobile lint, types and Jest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup Java (for OpenAPI Generator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate API client
        run: bun run apispec
      - name: Lint mobile app
        run: bun run --cwd apps/mobile lint
      - name: Typecheck mobile app
        run: bunx tsc --noEmit -p apps/mobile/tsconfig.json
      - name: Run mobile tests
        run: bun run --cwd apps/mobile test -- --ci --runInBand
