name: Deploy Mobile

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/api-client/**"
      - "packages/apispec/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-mobile.yml"
  workflow_dispatch:
    inputs:
      destination:
        description: Build destination
        type: choice
        required: true
        default: internal
        options:
          - internal
          - testflight

concurrency:
  group: deploy-mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.11"

jobs:
  quality:
    name: Mobile Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint mobile app
        run: bun run --cwd apps/mobile lint

      - name: Run mobile tests
        run: bun run --cwd apps/mobile test -- --ci

  build-internal:
    name: Build Internal (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && inputs.destination != 'testflight'
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Expo and EAS CLI
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
          packager: bun

      - name: Install dependencies
        if: env.EXPO_TOKEN != ''
        run: bun install --frozen-lockfile

      - name: Trigger EAS preview build
        if: env.EXPO_TOKEN != ''
        id: eas_build
        working-directory: apps/mobile
        run: |
          BUILD_JSON=$(eas build \
            --platform "${{ matrix.platform }}" \
            --profile preview \
            --non-interactive \
            --no-wait \
            --json)

          echo "$BUILD_JSON"

          BUILD_ID=$(echo "$BUILD_JSON" | node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(0,"utf8")); const payload=Array.isArray(data)?data[0]:data; process.stdout.write(payload?.id ?? "");')
          BUILD_URL=$(echo "$BUILD_JSON" | node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(0,"utf8")); const payload=Array.isArray(data)?data[0]:data; const url=payload?.buildDetailsPageUrl ?? payload?.artifacts?.buildUrl ?? ""; process.stdout.write(url);')

          if [ -z "$BUILD_ID" ]; then
            echo "Failed to parse EAS build ID from CLI output."
            exit 1
          fi

          if [ -z "$BUILD_URL" ]; then
            BUILD_URL="https://expo.dev/accounts/cosmic-dolphin/projects/cosmic-dolphin/builds/$BUILD_ID"
          fi

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Publish build link in job summary
        if: env.EXPO_TOKEN != ''
        run: |
          echo "### Internal build (${{ matrix.platform }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build ID: \`${{ steps.eas_build.outputs.build_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.eas_build.outputs.build_url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip internal build when Expo token is missing
        if: env.EXPO_TOKEN == ''
        run: |
          echo "### Internal build (${{ matrix.platform }}) skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: \`EXPO_TOKEN\` secret is not configured." >> "$GITHUB_STEP_SUMMARY"

  testflight:
    name: Build and submit to TestFlight
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.destination == 'testflight'
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require Expo authentication
        run: test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN is required for TestFlight builds."; exit 1; }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}
          packager: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Schedule production build and automatic TestFlight submission
        working-directory: apps/mobile
        run: |
          eas build --platform ios --profile production \
            --auto-submit --non-interactive --no-wait
          echo "### TestFlight build and submission scheduled" >> "$GITHUB_STEP_SUMMARY"
          echo "EAS will submit the production iOS build to App Store Connect after a successful build. Apple processing follows upload." >> "$GITHUB_STEP_SUMMARY"
          echo "Track progress: https://expo.dev/accounts/cosmic-dolphin/projects/cosmic-dolphin/builds" >> "$GITHUB_STEP_SUMMARY"
