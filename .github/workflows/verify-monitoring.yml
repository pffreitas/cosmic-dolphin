name: Verify save monitoring
on:
  pull_request:
    paths:
      - "scripts/monitoring/**"
      - "docs/monitoring/save-bookmark/grafana/**"
      - "docs/runbooks/save-bookmark-monitoring.md"
      - "supabase/migrations/**"
      - ".do/monitoring-app.yml"
      - ".github/workflows/*monitoring.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      MONITOR_IT_OWNED_TARGET: 127.0.0.1:49960
      MONITOR_IT_ADMIN_URL: postgres://supabase_admin:postgres@127.0.0.1:49960/postgres
      MONITOR_IT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:49960/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Offline tests and deterministic assets
        run: |
          bun --no-env-file test scripts/monitoring/__tests__/save-bookmarks.test.ts scripts/monitoring/__tests__/telemetry.test.ts scripts/monitoring/__tests__/grafana.test.ts scripts/monitoring/__tests__/deployment.test.ts scripts/monitoring/__tests__/cli.test.ts scripts/monitoring/__tests__/logs.test.ts
          bun --no-env-file scripts/monitoring/grafana.ts --check docs/monitoring/save-bookmark/grafana/assets.v1.json
      - name: Create this job's disposable database
        run: |
          docker run -d --name save-monitor-ci-db -p 127.0.0.1:49960:5432 -e POSTGRES_PASSWORD=postgres supabase/postgres:15.19.0.004
          for attempt in $(seq 1 60); do
            if docker exec save-monitor-ci-db pg_isready -h 127.0.0.1 -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Apply every migration and run real SQL tests
        run: |
          bun --no-env-file scripts/monitoring/__tests__/load-migrations.ts supabase/migrations
          bun --no-env-file test scripts/monitoring/__tests__/save-bookmarks.sql.test.ts
      - name: Build exact Linux image and exercise packaged CLI
        run: |
          docker build --platform linux/amd64 -f scripts/monitoring/Dockerfile -t save-monitor-proof:${{ github.sha }} .
          docker run --rm --network none --entrypoint bun save-monitor-proof:${{ github.sha }} --no-env-file test scripts/monitoring/__tests__/save-bookmarks.test.ts scripts/monitoring/__tests__/telemetry.test.ts scripts/monitoring/__tests__/grafana.test.ts scripts/monitoring/__tests__/deployment.test.ts scripts/monitoring/__tests__/cli.test.ts scripts/monitoring/__tests__/logs.test.ts
          docker run --rm --network none save-monitor-proof:${{ github.sha }} --fixture scripts/monitoring/__tests__/fixtures/healthy-no-traffic.json
      - name: Remove only this job's database
        if: always()
        run: docker rm -f save-monitor-ci-db
